worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream web { server web:8080; }
  upstream signaling { server signaling:3001; }
  server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 64k;
    location = /config { proxy_pass http://signaling; proxy_set_header Origin $http_origin; proxy_set_header Host $host; }
    location = /signal {
      proxy_pass http://signaling;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Origin $http_origin;
      proxy_set_header Host $host;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
    }
    location = /health/live { access_log off; proxy_pass http://web/health/live; }
    location = /health/ready { access_log off; proxy_pass http://signaling/health/ready; }
    location / { proxy_pass http://web; proxy_set_header Host $host; }
  }
}
